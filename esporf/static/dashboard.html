<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esporf Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232633;
    --border: #2e3245;
    --text: #e1e4ed;
    --text2: #8b90a5;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #3b82f6;
    --amber: #f59e0b;
    --purple: #a855f7;
    --cyan: #06b6d4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── Header ──────────────────────────────── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .header h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .header h1 span { color: var(--blue); }
  .scan-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text2);
  }
  .scan-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── Layout ──────────────────────────────── */
  .container { max-width: 1320px; margin: 0 auto; padding: 24px; }

  .stat-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .card-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text2);
    margin-bottom: 4px;
  }
  .card-value {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .card-sub {
    font-size: 13px;
    color: var(--text2);
    margin-top: 2px;
  }
  .positive { color: var(--green); }
  .negative { color: var(--red); }
  .neutral { color: var(--text2); }

  /* ── Grid ─────────────────────────────────── */
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  @media (max-width: 900px) {
    .grid-2 { grid-template-columns: 1fr; }
  }

  .section-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--blue);
  }

  /* ── Tables ──────────────────────────────── */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    padding: 8px 10px;
    font-weight: 600;
    color: var(--text2);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(59,130,246,0.04); }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .badge-win { background: rgba(34,197,94,0.15); color: var(--green); }
  .badge-loss { background: rgba(239,68,68,0.15); color: var(--red); }
  .badge-push { background: rgba(245,158,11,0.15); color: var(--amber); }
  .badge-pending { background: rgba(59,130,246,0.15); color: var(--blue); }

  .badge-elite { background: rgba(168,85,247,0.15); color: var(--purple); }
  .badge-solid { background: rgba(34,197,94,0.15); color: var(--green); }
  .badge-watchlist { background: rgba(245,158,11,0.15); color: var(--amber); }
  .badge-blocked { background: rgba(239,68,68,0.15); color: var(--red); }
  .badge-new { background: rgba(59,130,246,0.15); color: var(--blue); }

  /* ── Tabs ─────────────────────────────────── */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
  }
  .tab {
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--text2);
    transition: all 0.15s;
  }
  .tab:hover { background: var(--surface2); color: var(--text); }
  .tab.active { background: var(--blue); color: #fff; }

  /* ── Charts ──────────────────────────────── */
  .chart-wrap {
    position: relative;
    height: 220px;
  }

  /* ── Search ──────────────────────────────── */
  .search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .search-box input {
    flex: 1;
    padding: 8px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .search-box input:focus { border-color: var(--blue); }
  .search-box button {
    padding: 8px 18px;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .search-box button:hover { opacity: 0.9; }

  .player-card {
    display: none;
    margin-top: 12px;
  }
  .player-card.show { display: block; }

  .player-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .player-header h3 { font-size: 18px; font-weight: 700; }

  .player-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
  }
  .player-stat {
    background: var(--surface2);
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }
  .player-stat .val { font-size: 20px; font-weight: 700; }
  .player-stat .lbl { font-size: 11px; color: var(--text2); text-transform: uppercase; }

  /* ── Filters ─────────────────────────────── */
  .filters {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .filters select, .filters input[type="number"] {
    padding: 6px 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  .filters label {
    font-size: 12px;
    color: var(--text2);
  }

  /* ── Loading/Error ───────────────────────── */
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--text2);
    font-size: 14px;
  }
  .error {
    text-align: center;
    padding: 20px;
    color: var(--red);
    font-size: 13px;
  }
  .empty {
    text-align: center;
    padding: 30px;
    color: var(--text2);
    font-size: 13px;
  }

  /* ── Full width sections ─────────────────── */
  .full-section { margin-bottom: 24px; }
</style>
</head>
<body>

<div class="header">
  <h1><span>Esporf</span> Dashboard</h1>
  <div class="scan-badge">
    <div class="scan-dot" id="scanDot"></div>
    <span id="scanInfo">Loading...</span>
  </div>
</div>

<div class="container">
  <!-- Stat cards -->
  <div class="stat-cards" id="statCards">
    <div class="card"><div class="card-label">Record</div><div class="card-value" id="sRecord">--</div><div class="card-sub" id="sRecordSub">&nbsp;</div></div>
    <div class="card"><div class="card-label">Profit</div><div class="card-value" id="sProfit">--</div><div class="card-sub" id="sProfitSub">&nbsp;</div></div>
    <div class="card"><div class="card-label">Win Rate</div><div class="card-value" id="sWinRate">--</div><div class="card-sub" id="sWinRateSub">&nbsp;</div></div>
    <div class="card"><div class="card-label">ROI</div><div class="card-value" id="sROI">--</div><div class="card-sub" id="sROISub">&nbsp;</div></div>
    <div class="card"><div class="card-label">Pending</div><div class="card-value" id="sPending">--</div><div class="card-sub" id="sPendingSub">&nbsp;</div></div>
  </div>

  <!-- Charts row -->
  <div class="grid-2">
    <div class="card">
      <div class="section-title"><div class="dot"></div> Profit by League</div>
      <div class="chart-wrap"><canvas id="leagueChart"></canvas></div>
    </div>
    <div class="card">
      <div class="section-title"><div class="dot"></div> Profit by Market</div>
      <div class="chart-wrap"><canvas id="marketChart"></canvas></div>
    </div>
  </div>

  <!-- Live picks + Leagues -->
  <div class="grid-2">
    <div class="card">
      <div class="section-title"><div class="dot" style="background:var(--green)"></div> Live Picks</div>
      <div id="livePicks"><div class="loading">Loading...</div></div>
    </div>
    <div class="card">
      <div class="section-title"><div class="dot" style="background:var(--purple)"></div> Leagues</div>
      <div id="leagueTable"><div class="loading">Loading...</div></div>
    </div>
  </div>

  <!-- Pick history -->
  <div class="card full-section">
    <div class="section-title"><div class="dot" style="background:var(--amber)"></div> Pick History</div>
    <div class="filters">
      <label>Result:</label>
      <select id="filterResult">
        <option value="">All</option>
        <option value="win">Wins</option>
        <option value="loss">Losses</option>
        <option value="push">Pushes</option>
      </select>
      <label>League:</label>
      <select id="filterLeague">
        <option value="">All</option>
        <option value="42648">GG League</option>
        <option value="42649">GT Leagues</option>
        <option value="38439">Volta</option>
      </select>
      <label>Last N days:</label>
      <input type="number" id="filterDays" placeholder="all" min="1" max="365" style="width:70px">
    </div>
    <div id="pickHistory"><div class="loading">Loading...</div></div>
  </div>

  <!-- Player lookup + Recent matches -->
  <div class="grid-2">
    <div class="card">
      <div class="section-title"><div class="dot" style="background:var(--cyan)"></div> Player Lookup</div>
      <div class="search-box">
        <input type="text" id="playerInput" placeholder="Enter player name..." />
        <button onclick="searchPlayer()">Search</button>
      </div>
      <div class="player-card" id="playerCard"></div>
      <div id="playerError"></div>
    </div>
    <div class="card">
      <div class="section-title"><div class="dot" style="background:var(--amber)"></div> Recent Matches</div>
      <div id="recentMatches"><div class="loading">Loading...</div></div>
    </div>
  </div>

  <!-- Top players -->
  <div class="card full-section">
    <div class="section-title"><div class="dot" style="background:var(--purple)"></div> Top Players</div>
    <div class="tabs" id="playerTabs">
      <button class="tab active" data-tier="">All</button>
      <button class="tab" data-tier="elite">Elite</button>
      <button class="tab" data-tier="solid">Solid</button>
      <button class="tab" data-tier="watchlist">Watchlist</button>
    </div>
    <div id="playersTable"><div class="loading">Loading...</div></div>
  </div>
</div>

<script>
const API = window.location.origin;

// ── Fetcher ───────────────────────────────────
async function api(path) {
  const res = await fetch(API + path);
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

// ── Stats cards ───────────────────────────────
async function loadStats() {
  try {
    const s = await api('/stats');
    document.getElementById('sRecord').textContent = s.record;
    document.getElementById('sRecordSub').textContent = `${s.total_decided} decided`;

    const profEl = document.getElementById('sProfit');
    profEl.textContent = s.profit_display;
    profEl.className = 'card-value ' + (s.profit >= 0 ? 'positive' : 'negative');
    document.getElementById('sProfitSub').textContent = `${s.units_wagered}u wagered`;

    document.getElementById('sWinRate').textContent = s.win_rate_pct;
    document.getElementById('sWinRateSub').textContent = `${s.wins}W / ${s.losses}L`;

    const roiEl = document.getElementById('sROI');
    roiEl.textContent = s.roi_pct;
    roiEl.className = 'card-value ' + (s.roi !== null && s.roi >= 0 ? 'positive' : s.roi !== null ? 'negative' : 'neutral');
    document.getElementById('sROISub').textContent = 'return on investment';

    document.getElementById('sPending').textContent = s.pending;
    document.getElementById('sPendingSub').textContent = 'awaiting result';
  } catch(e) {
    console.error('Stats error:', e);
  }
}

// ── Scan status ───────────────────────────────
async function loadScan() {
  try {
    const s = await api('/scan/status');
    const el = document.getElementById('scanInfo');
    const dot = document.getElementById('scanDot');
    if (s.last_scan) {
      el.textContent = `Scan #${s.last_scan.scan_number} \u2022 ${s.last_scan.started_at_fmt} \u2022 ${s.last_scan.picks_generated} picks`;
      dot.style.background = 'var(--green)';
    } else {
      el.textContent = `${s.database.total_matches} matches in DB \u2022 No scans yet`;
      dot.style.background = 'var(--amber)';
    }
  } catch(e) {
    document.getElementById('scanInfo').textContent = 'API connected';
  }
}

// ── Live picks ────────────────────────────────
async function loadLivePicks() {
  const el = document.getElementById('livePicks');
  try {
    const picks = await api('/picks/live');
    if (!picks.length) {
      el.innerHTML = '<div class="empty">No pending picks right now</div>';
      return;
    }
    let html = '<table><thead><tr><th>Match</th><th>Market</th><th>Units</th><th>Odds</th><th>Edge</th></tr></thead><tbody>';
    for (const p of picks) {
      html += `<tr>
        <td>${esc(p.home)} vs ${esc(p.away)}<br><span style="color:var(--text2);font-size:11px">${esc(p.league)}</span></td>
        <td>${esc(p.market)}</td>
        <td>${p.units}u</td>
        <td>${p.odds_american || 'N/A'}</td>
        <td>${p.edge_pct || 'N/A'}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = '<div class="error">Failed to load live picks</div>';
  }
}

// ── Leagues ───────────────────────────────────
let leagueData = [];
async function loadLeagues() {
  const el = document.getElementById('leagueTable');
  try {
    leagueData = await api('/leagues');
    let html = '<table><thead><tr><th>League</th><th>Matches</th><th>Record</th><th>Profit</th><th>Win %</th></tr></thead><tbody>';
    for (const l of leagueData) {
      const cls = l.profit >= 0 ? 'positive' : 'negative';
      html += `<tr>
        <td>${esc(l.league)}</td>
        <td>${l.total_matches.toLocaleString()}</td>
        <td>${l.record}</td>
        <td class="${cls}">${l.profit_display}</td>
        <td>${l.win_rate_pct}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    el.innerHTML = html;
    renderLeagueChart();
  } catch(e) {
    el.innerHTML = '<div class="error">Failed to load leagues</div>';
  }
}

// ── Pick history ──────────────────────────────
async function loadPickHistory() {
  const el = document.getElementById('pickHistory');
  el.innerHTML = '<div class="loading">Loading...</div>';
  try {
    let url = '/picks/history?limit=100';
    const result = document.getElementById('filterResult').value;
    const league = document.getElementById('filterLeague').value;
    const days = document.getElementById('filterDays').value;
    if (result) url += `&result=${result}`;
    if (league) url += `&league_id=${league}`;
    if (days) url += `&days=${days}`;

    const picks = await api(url);
    if (!picks.length) {
      el.innerHTML = '<div class="empty">No picks match these filters</div>';
      return;
    }
    let html = '<table><thead><tr><th>Match</th><th>League</th><th>Market</th><th>Units</th><th>Odds</th><th>Score</th><th>Result</th><th>P/L</th></tr></thead><tbody>';
    for (const p of picks) {
      const cls = p.result === 'win' ? 'badge-win' : p.result === 'loss' ? 'badge-loss' : p.result === 'push' ? 'badge-push' : 'badge-pending';
      const plCls = p.profit >= 0 ? 'positive' : 'negative';
      html += `<tr>
        <td>${esc(p.home)} vs ${esc(p.away)}</td>
        <td>${esc(p.league)}</td>
        <td>${esc(p.market)}</td>
        <td>${p.units}u</td>
        <td>${p.odds_american || 'N/A'}</td>
        <td>${p.score || '-'}</td>
        <td><span class="badge ${cls}">${p.result}</span></td>
        <td class="${plCls}">${p.profit_display}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = '<div class="error">Failed to load pick history</div>';
  }
}

// ── Recent matches ────────────────────────────
async function loadRecentMatches() {
  const el = document.getElementById('recentMatches');
  try {
    const matches = await api('/matches/recent?limit=15');
    if (!matches.length) {
      el.innerHTML = '<div class="empty">No matches in database</div>';
      return;
    }
    let html = '<table><thead><tr><th>Match</th><th>Score</th><th>League</th><th>Time</th></tr></thead><tbody>';
    for (const m of matches) {
      html += `<tr>
        <td>${esc(m.home)} vs ${esc(m.away)}</td>
        <td><strong>${m.score}</strong> (${m.total_goals}g)</td>
        <td>${esc(m.league)}</td>
        <td style="font-size:11px;color:var(--text2)">${esc(m.start_time_fmt)}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = '<div class="error">Failed to load matches</div>';
  }
}

// ── Player search ─────────────────────────────
async function searchPlayer() {
  const name = document.getElementById('playerInput').value.trim();
  const card = document.getElementById('playerCard');
  const errEl = document.getElementById('playerError');
  errEl.innerHTML = '';
  card.classList.remove('show');
  if (!name) return;

  try {
    const p = await api(`/player/${encodeURIComponent(name)}`);
    const tierCls = 'badge-' + p.tier.toLowerCase();
    card.innerHTML = `
      <div class="player-header">
        <h3>${esc(p.handle)}</h3>
        <span class="badge ${tierCls}">${p.tier}</span>
      </div>
      <div class="player-grid">
        <div class="player-stat"><div class="val">${p.matches_played}</div><div class="lbl">Matches</div></div>
        <div class="player-stat"><div class="val">${p.win_rate_pct}</div><div class="lbl">Win Rate</div></div>
        <div class="player-stat"><div class="val">${p.avg_goals_scored}</div><div class="lbl">Avg GF</div></div>
        <div class="player-stat"><div class="val">${p.avg_goals_conceded}</div><div class="lbl">Avg GA</div></div>
        <div class="player-stat"><div class="val">${p.avg_total_goals}</div><div class="lbl">Avg Total</div></div>
        <div class="player-stat"><div class="val">${(p.over_rates['4.5'] * 100).toFixed(0)}%</div><div class="lbl">O4.5 Rate</div></div>
      </div>
      <div style="margin-top:14px">
        <div class="card-label">Recent Form (Last ${p.recent.matches})</div>
        <div class="player-grid" style="margin-top:8px">
          <div class="player-stat"><div class="val">${p.recent.win_rate_pct}</div><div class="lbl">Win Rate</div></div>
          <div class="player-stat"><div class="val">${p.recent.wins}W-${p.recent.losses}L-${p.recent.draws}D</div><div class="lbl">Record</div></div>
          <div class="player-stat"><div class="val">${p.recent.avg_goals_scored}</div><div class="lbl">Avg GF</div></div>
          <div class="player-stat"><div class="val">${p.form_trend}</div><div class="lbl">Trend</div></div>
        </div>
      </div>
    `;
    card.classList.add('show');
  } catch(e) {
    errEl.innerHTML = `<div class="error">Player "${esc(name)}" not found. Names are case-sensitive.</div>`;
  }
}

document.getElementById('playerInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchPlayer();
});

// ── Players table ─────────────────────────────
let currentTier = '';
async function loadPlayers(tier) {
  currentTier = tier || '';
  const el = document.getElementById('playersTable');
  el.innerHTML = '<div class="loading">Loading...</div>';
  try {
    let url = '/players?min_matches=10';
    if (tier) url += `&tier=${tier}`;
    const players = await api(url);
    if (!players.length) {
      el.innerHTML = '<div class="empty">No players match this filter</div>';
      return;
    }
    // Sort by win rate descending
    players.sort((a, b) => b.win_rate - a.win_rate);
    let html = '<table><thead><tr><th>Player</th><th>League</th><th>Tier</th><th>Matches</th><th>Win %</th><th>Avg GF</th><th>Avg GA</th><th>O4.5%</th><th>Trend</th></tr></thead><tbody>';
    for (const p of players.slice(0, 50)) {
      const tierCls = 'badge-' + p.tier.toLowerCase();
      html += `<tr>
        <td><strong>${esc(p.handle)}</strong></td>
        <td>${esc(p.league)}</td>
        <td><span class="badge ${tierCls}">${p.tier}</span></td>
        <td>${p.matches_played}</td>
        <td>${p.win_rate_pct}</td>
        <td>${p.avg_goals_scored}</td>
        <td>${p.avg_goals_conceded}</td>
        <td>${(p.over_rates['4.5'] * 100).toFixed(0)}%</td>
        <td>${p.form_trend}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = '<div class="error">Failed to load players</div>';
  }
}

// Player tab switching
document.getElementById('playerTabs').addEventListener('click', e => {
  if (!e.target.classList.contains('tab')) return;
  document.querySelectorAll('#playerTabs .tab').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  loadPlayers(e.target.dataset.tier);
});

// ── Charts ────────────────────────────────────
let leagueChart, marketChart;

function renderLeagueChart() {
  if (!leagueData.length) return;
  const ctx = document.getElementById('leagueChart').getContext('2d');
  if (leagueChart) leagueChart.destroy();

  const colors = [
    'rgba(59,130,246,0.8)',
    'rgba(168,85,247,0.8)',
    'rgba(6,182,212,0.8)',
  ];
  const borderColors = [
    'rgba(59,130,246,1)',
    'rgba(168,85,247,1)',
    'rgba(6,182,212,1)',
  ];

  leagueChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: leagueData.map(l => l.league),
      datasets: [{
        label: 'Profit (units)',
        data: leagueData.map(l => l.profit),
        backgroundColor: leagueData.map((l, i) => l.profit >= 0 ? colors[i % 3] : 'rgba(239,68,68,0.6)'),
        borderColor: leagueData.map((l, i) => l.profit >= 0 ? borderColors[i % 3] : 'rgba(239,68,68,1)'),
        borderWidth: 1,
        borderRadius: 6,
      }]
    },
    options: chartOpts('units'),
  });
}

async function renderMarketChart() {
  try {
    const bd = await api('/stats/breakdown');
    const ctx = document.getElementById('marketChart').getContext('2d');
    if (marketChart) marketChart.destroy();

    const mkt = bd.by_market;
    if (!mkt.length) return;

    const colors = mkt.map(m => m.profit >= 0 ? 'rgba(34,197,94,0.7)' : 'rgba(239,68,68,0.6)');

    marketChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: mkt.map(m => m.market),
        datasets: [{
          label: 'Profit (units)',
          data: mkt.map(m => m.profit),
          backgroundColor: colors,
          borderColor: colors.map(c => c.replace('0.7', '1').replace('0.6', '1')),
          borderWidth: 1,
          borderRadius: 6,
        }]
      },
      options: chartOpts('units'),
    });
  } catch(e) {
    console.error('Market chart error:', e);
  }
}

function chartOpts(yLabel) {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
    },
    scales: {
      x: {
        ticks: { color: '#8b90a5', font: { size: 11 } },
        grid: { display: false },
      },
      y: {
        ticks: { color: '#8b90a5', font: { size: 11 }, callback: v => v + 'u' },
        grid: { color: 'rgba(46,50,69,0.5)' },
      },
    },
  };
}

// ── Filter listeners ──────────────────────────
document.getElementById('filterResult').addEventListener('change', loadPickHistory);
document.getElementById('filterLeague').addEventListener('change', loadPickHistory);
document.getElementById('filterDays').addEventListener('change', loadPickHistory);

// ── Escape HTML ───────────────────────────────
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// ── Init ──────────────────────────────────────
async function init() {
  await Promise.all([
    loadStats(),
    loadScan(),
    loadLivePicks(),
    loadLeagues(),
    loadPickHistory(),
    loadRecentMatches(),
    loadPlayers(''),
    renderMarketChart(),
  ]);
}

init();

// Auto-refresh every 60 seconds
setInterval(() => {
  loadStats();
  loadScan();
  loadLivePicks();
}, 60000);
</script>
