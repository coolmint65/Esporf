services:
  esporf:
    build: .
    container_name: esporf
    restart: unless-stopped
    env_file: .env
    volumes:
      - esporf-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Uncomment to run the Discord bot instead of the polling loop
  # esporf-discord:
  #   build: .
  #   container_name: esporf-discord
  #   restart: unless-stopped
  #   env_file: .env
  #   command: ["discord"]
  #   volumes:
  #     - esporf-data:/app/data
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

volumes:
  esporf-data:
