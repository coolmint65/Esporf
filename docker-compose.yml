services:
  esporf-discord:
    build: .
    container_name: esporf-discord
    restart: unless-stopped
    env_file: .env
    command: ["discord"]
    volumes:
      - esporf-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  esporf-data:
